spring:
  # PostgreSQL Configuration (Production - Railway)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:sakura.proxy.rlwy.net}:${PGPORT:17451}/${PGDATABASE:railway}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:YuTJvljTRuIwrjnnqKyGlKeIWBGYVLAG}}

  h2:
    console:
      enabled: false

  # Mail Configuration
  mail:
    host: ${SPRING_MAIL_HOST:smtp.naver.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:logcom2@naver.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.naver.com

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

# Logging
logging:
  level:
    kr.co.tobetheone.ncms: INFO
    org.springframework.web: WARN

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://logcom.co.kr,http://logcom.co.kr,https://*.logcom.co.kr,http://*.logcom.co.kr,https://api.logcom.co.kr,http://api.logcom.co.kr,https://ncms-omega.vercel.app,https://*.vercel.app,http://localhost:5173,http://localhost:3000}

