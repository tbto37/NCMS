spring:
  application:
    name: ncms-backend

  # PostgreSQL Database Configuration
  datasource:
    url: 'jdbc:postgresql://sakura.proxy.rlwy.net:17451/railway'
    driver-class-name: 'org.postgresql.Driver'
    username: 'postgres'
    password: 'YuTJvljTRuIwrjnnqKyGlKeIWBGYVLAG'

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    kr.co.tobetheone.ncms: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
